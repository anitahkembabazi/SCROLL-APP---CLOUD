<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>SCROLL</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root { --bg:#1e1033; --card:#2e1065; --ink:#f5f3ff; --soft:#c4b5fd; --accent:#7c3aed; }
  * { box-sizing:border-box; font-family:Inter,system-ui,sans-serif; }
  body { margin:0; background:#0f0a1e; color:var(--ink); display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; max-width:100vw; height:844px; max-height:100vh; background:var(--bg); border-radius:36px; overflow:hidden; box-shadow:0 0 0 10px #1e1033, 0 20px 60px rgba(124,58,237,.4); position:relative; }
  @media (max-width: 480px), (max-height: 900px) {
    .phone { width:100vw; height:100vh; border-radius:0; box-shadow:none; }
  }
  header { position:absolute; top:0; left:0; right:0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:linear-gradient(180deg, rgba(30,16,51,.9), transparent); }
  header .logo { height:32px; vertical-align:middle; border-radius:8px; }
  header button { background:transparent; color:var(--ink); border:1px solid var(--soft); border-radius:999px; padding:6px 14px; cursor:pointer; margin-left:6px; }
  #feed { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  #feed::-webkit-scrollbar { display:none; }
  .slide { height:100%; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
  .slide video, .slide iframe, .slide .yt { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:0; }
  .meta { position:relative; z-index:2; padding:24px; background:linear-gradient(0deg, rgba(30,16,51,.85), transparent); }
  .meta .user { color:var(--soft); font-weight:700; }
  .actions { position:absolute; right:12px; bottom:100px; z-index:2; display:flex; flex-direction:column; gap:18px; font-size:26px; }
  .actions button { background:none; border:none; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .actions .count { color:#fff; font-weight:700; font-size:13px; }
  dialog { border:none; border-radius:16px; background:#fff; color:#3b0764; padding:24px; width:320px; }
  dialog button { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:8px 16px; margin-top:8px; }
  dialog input { width:100%; padding:8px; margin:6px 0; border-radius:10px; border:1px solid var(--soft); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <span><img class="logo" src="logo.jpeg" alt="SCROLL logo"/> <b style="color:var(--soft);letter-spacing:3px">SCROLL</b></span>
    <span>
      <button id="signinBtn" onclick="document.getElementById('loginDlg').showModal()">Sign in</button>
      <button id="uploadBtn" onclick="needAuth(() => document.getElementById('upDlg').showModal())">Upload</button>
    </span>
  </header>
  <div id="feed"></div>
</div>

<dialog id="loginDlg">
  <h3>Sign in</h3>
  <input id="username" placeholder="username"/>
  <button onclick="signIn()">Continue</button>
  <div id="authMsg"></div>
</dialog>

<dialog id="upDlg">
  <h3>Upload a video</h3>
  <input id="fileInput" type="file" accept="video/*"/>
  <button onclick="addLocalVideo()">Add to feed</button>
  <div id="upMsg"></div>
</dialog>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// YouTube video IDs used for the demo feed (public videos with sound)
const CATALOG = [
  { ytid: 'aqz-KE-bpKQ', user: 'animation.lab', title: 'Big Buck Bunny 4K' },
  { ytid: 'kffacxfA7G4', user: 'animation.lab', title: 'Big Buck Bunny' },
  { ytid: 'eRsGyueVLvQ', user: 'film.school', title: 'Sintel' },
  { ytid: 'YE7VzlLtp-4', user: 'film.school', title: 'Elephants Dream' },
  { ytid: '9bZkp7q19f0', user: 'fun.reels', title: 'Trending clip' },
  { ytid: 'dQw4w9WgXcQ', user: 'fun.reels', title: 'Classic' },
];
let videos = [...CATALOG];
let liked = new Set();
let players = {};      // ytid-index -> YT.Player
let soundOn = false;

function slideHTML(v, i) {
  const media = v.file
    ? `<video src="${v.file}" loop playsinline preload="auto" style="background:#000" onclick="this.paused?this.play():this.pause()"></video>`
    : `<div id="yt${i}" class="yt"></div>`;
  return `<div class="slide" data-i="${i}">
    ${media}
    <div class="meta"><div class="user">@${v.user}</div><div>${v.title}</div></div>
    <div class="actions">
      <button class="tt" onclick="like(${i}, this)" title="Like">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <div class="count" id="lc${i}">0</div>
      </button>
      <button class="tt" title="Comments" onclick="needAuth(() => this.querySelector('.count').textContent=Number(this.querySelector('.count').textContent)+1)">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="white" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1L3 20l1.1-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <div class="count">0</div>
      </button>
      <button class="tt" title="Share">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="white" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        <div class="count">Share</div>
      </button>
    </div>
  </div>`;
}

function render() {
  const feed = document.getElementById('feed');
  feed.innerHTML = videos.map(slideHTML).join('');
  videos.forEach((v, i) => {
    if (v.ytid) {
      players['yt'+i] = new YT.Player('yt'+i, {
        videoId: v.ytid,
        playerVars: { autoplay: 1, mute: 0, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, loop: 1, playlist: v.ytid },
        events: { onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) players['yt'+i].playVideo(); } }
      });
    }
  });
  observeSlides();
}

// YouTube API ready callback
function onYouTubeIframeAPIReady() { buildFeed(); }

// ---- SerpAPI "short videos" source (only other API we use) ----
const SERPAPI_KEY = ''; // paste your key here to load live short videos
async function loadFromSerpAPI() {
  if (!SERPAPI_KEY) return null;
  const url = `https://serpapi.com/search.json?engine=google&q=short+videos&tbm=vid&tbs=qdr:d&api_key=${SERPAPI_KEY}`;
  const r = await fetch(url);
  const data = await r.json();
  const items = (data.video_results || [])
    .map(v => ({ ytid: (v.link || '').match(/[?&]v=([^&]+)/)?.[1], user: v.source || 'web', title: v.title || 'short' }))
    .filter(v => v.ytid);
  return items.length ? items : null;
}

async function buildFeed() {
  try {
    const live = await loadFromSerpAPI();
    if (live) videos = live;
  } catch (e) { console.warn('SerpAPI failed, using fallback list', e); }
  render();
  // If the browser blocks unmuted autoplay, start muted and unmute on first tap
  setTimeout(() => {
    Object.values(players).forEach(p => {
      try { if (p.getPlayerState && p.getPlayerState() !== 1) { p.mute(); p.playVideo(); } } catch (e) {}
    });
  }, 2000);
}

// Play only the visible slide, pause the rest; first user gesture turns sound on
function observeSlides() {
  const feed = document.getElementById('feed');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const i = en.target.dataset.i;
      const p = players['yt'+i];
      const vid = en.target.querySelector('video');
      if (en.isIntersecting) {
        if (p) { if (!soundOn) p.mute(); p.playVideo(); }
        else if (vid) { vid.muted = !soundOn; vid.play(); }
      } else {
        p ? p.pauseVideo() : (vid && vid.pause());
      }
    });
  }, { root: feed, threshold: 0.6 });
  feed.querySelectorAll('.slide').forEach(s => io.observe(s));
}

window.addEventListener('pointerdown', () => {
  if (!soundOn) {
    soundOn = true;
    Object.values(players).forEach(p => { try { p.unMute(); } catch(e){} });
    document.querySelectorAll('video').forEach(v => v.muted = false);
  }
}, { once: true });

function attachEndless() {
  const feed = document.getElementById('feed');
  feed.addEventListener('scroll', () => {
    if (feed.scrollTop + feed.clientHeight > feed.scrollHeight - 200) {
      const start = videos.length;
      feed.insertAdjacentHTML('beforeend', CATALOG.map((v,i)=>slideHTML(v, start+i)).join(''));
      CATALOG.forEach((v, i) => {
        const idx = start + i;
        if (v.ytid) players['yt'+idx] = new YT.Player('yt'+idx, {
          videoId: v.ytid,
          playerVars: { autoplay: 1, mute: 0, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, loop: 1, playlist: v.ytid },
          events: { onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) players['yt'+idx].playVideo(); } }
        });
      });
      videos = videos.concat(CATALOG);
      observeSlides();
    }
  });
}

function needAuth(action) {
  if (localStorage.getItem('scrollUser')) return action();
  document.getElementById('authMsg').textContent = 'Please sign up or sign in first.';
  document.getElementById('loginDlg').showModal();
}
function like(i, btn) {
  liked.add(i);
  const svg = btn.querySelector('svg');
  svg.setAttribute('fill', '#FE2C55');
  const c = document.getElementById('lc'+i);
  c.textContent = Number(c.textContent) + 1;
}
function signIn() {
  const u = document.getElementById('username').value.trim();
  if (u) {
    document.getElementById('signinBtn').textContent = u;
    localStorage.setItem('scrollUser', u);
    document.getElementById('loginDlg').close();
    document.getElementById('uploadBtn').textContent = '+';
    document.getElementById('uploadBtn').title = 'Upload';
    document.getElementById('upDlg').showModal();
  }
}
function addLocalVideo() {
  const f = document.getElementById('fileInput').files[0];
  if (!f) { document.getElementById('upMsg').textContent = 'Choose a video file first.'; return; }
  videos.unshift({ file: URL.createObjectURL(f), user: localStorage.getItem('scrollUser') || 'you', title: f.name });
  render();
  document.getElementById('upMsg').textContent = 'Added to the top of your feed!';
}

const saved = localStorage.getItem('scrollUser');
if (saved) {
  document.getElementById('signinBtn').textContent = saved;
  document.getElementById('uploadBtn').textContent = '+';
}
// render() is triggered by onYouTubeIframeAPIReady once the API loads
attachEndless();
</script>
</body>
</html>
