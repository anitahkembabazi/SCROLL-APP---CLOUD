<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>SCROLL</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root { --bg:#1e1033; --card:#2e1065; --ink:#f5f3ff; --soft:#c4b5fd; --accent:#7c3aed; }
  * { box-sizing:border-box; font-family:Inter,system-ui,sans-serif; }
  body { margin:0; background:#0f0a1e; color:var(--ink); display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .phone { width:390px; max-width:100vw; height:844px; max-height:100vh; background:var(--bg); border-radius:36px; overflow:hidden; box-shadow:0 0 0 10px #1e1033, 0 20px 60px rgba(124,58,237,.4); position:relative; }
  header { position:absolute; top:0; left:0; right:0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:linear-gradient(180deg, rgba(30,16,51,.9), transparent); }
  header .logo { height:32px; vertical-align:middle; border-radius:8px; }
  header button { background:transparent; color:var(--ink); border:1px solid var(--soft); border-radius:999px; padding:6px 14px; cursor:pointer; margin-left:6px; }
  #feed { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; }
  .slide { height:100%; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
  .slide video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .meta { position:relative; z-index:2; padding:24px; background:linear-gradient(0deg, rgba(30,16,51,.85), transparent); }
  .meta .user { color:var(--soft); font-weight:700; }
  .actions { position:absolute; right:12px; bottom:100px; z-index:2; display:flex; flex-direction:column; gap:18px; font-size:26px; }
  .actions button { background:none; border:none; color:#fff; cursor:pointer; font-size:26px; }
  dialog { border:none; border-radius:16px; background:#fff; color:#3b0764; padding:24px; width:320px; }
  dialog button { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:8px 16px; margin-top:8px; }
  dialog input { width:100%; padding:8px; margin:6px 0; border-radius:10px; border:1px solid var(--soft); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <span><img class="logo" src="logo.jpeg" alt="SCROLL logo"/> <b style="color:var(--soft);letter-spacing:3px">SCROLL</b></span>
    <span>
      <button id="signinBtn" onclick="document.getElementById('loginDlg').showModal()">Sign in</button>
      <button onclick="document.getElementById('upDlg').showModal()">Upload</button>
    </span>
  </header>
  <div id="feed"></div>
</div>

<dialog id="loginDlg">
  <h3>Sign in</h3>
  <input id="username" placeholder="username"/>
  <button onclick="signIn()">Continue</button>
  <div id="authMsg"></div>
</dialog>

<dialog id="upDlg">
  <h3>Upload a video</h3>
  <input id="fileInput" type="file" accept="video/*"/>
  <button onclick="addLocalVideo()">Add to feed</button>
  <div id="upMsg"></div>
</dialog>

<script>
const CATALOG = [
  { src: 'videos/big-buck-bunny.mp4', user: 'nature.daily', title: 'Big Buck Bunny' },
  { src: 'videos/flower.mp4', user: 'animation.lab', title: 'Flower' },
  { src: 'videos/friday.mp4', user: 'fun.reels', title: 'Friday' },
];
let videos = [...CATALOG];
let liked = new Set();

function slideHTML(v, i) {
  return `<div class="slide">
    <video src="${v.src}" muted loop playsinline ${i===0?'autoplay':''}></video>
    <div class="meta"><div class="user">@${v.user}</div><div>${v.title}</div></div>
    <div class="actions"><button onclick="like(${i}, this)">❤️</button><button>↗️</button></div>
  </div>`;
}

function render() {
  const feed = document.getElementById('feed');
  feed.innerHTML = videos.map(slideHTML).join('');
}

// "Unlimited" feed: keep appending the base catalog as the user nears the bottom
function attachEndless() {
  const feed = document.getElementById('feed');
  feed.addEventListener('scroll', () => {
    if (feed.scrollTop + feed.clientHeight > feed.scrollHeight - 200) {
      const start = videos.length;
      feed.insertAdjacentHTML('beforeend', CATALOG.map((v,i)=>slideHTML(v, start+i)).join(''));
      videos = videos.concat(CATALOG);
    }
  });
}

function like(i, btn) { liked.add(i); btn.textContent = '💖'; }
function signIn() {
  const u = document.getElementById('username').value.trim();
  if (u) { document.getElementById('signinBtn').textContent = u; localStorage.setItem('scrollUser', u); document.getElementById('loginDlg').close(); }
}
function addLocalVideo() {
  const f = document.getElementById('fileInput').files[0];
  if (!f) { document.getElementById('upMsg').textContent = 'Choose a video file first.'; return; }
  videos.unshift({ src: URL.createObjectURL(f), user: localStorage.getItem('scrollUser') || 'you', title: f.name });
  render();
  document.getElementById('upMsg').textContent = 'Added to the top of your feed!';
}

const saved = localStorage.getItem('scrollUser');
if (saved) document.getElementById('signinBtn').textContent = saved;
render();
attachEndless();
</script>
</body>
</html>
